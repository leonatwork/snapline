name: Release

on:
  push:
    tags: ['v*']
  # Manual run: builds and signs without publishing, the zip is kept as an artifact.
  workflow_dispatch:

permissions:
  contents: read

# One release run per ref at a time; a running publish is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Test, build, sign and package with a read-only token. Signing key and
  # keychain never leave this job.
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $APP_VERSION in Resources/Info.plist."
            exit 1
          fi

      - name: Import signing certificate
        id: signing
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          # Without the secrets the build falls back to ad-hoc signing.
          if [ -z "$P12" ]; then
            echo "::warning::MACOS_SIGNING_P12 is not set, building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # The existing keychains are passed as separate arguments on purpose.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=leonatwork Code Signing" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build
        run: scripts/build-app.sh

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          codesign --verify --strict "dist/Snapline.app"
          # A stable identity shows up as "certificate leaf" in the designated requirement.
          codesign -d -r- "dist/Snapline.app" 2>&1 | grep "certificate leaf"

      - name: Package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
        run: |
          # ditto rather than zip: it preserves the code signature.
          ditto -c -k --keepParent dist/Snapline.app "Snapline-${VERSION}.zip"
          shasum -a 256 "Snapline-${VERSION}.zip" | tee checksum.txt

      - name: Keep manual build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Snapline-manual
          path: Snapline-manual.zip

      - name: Keep release package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: |
            Snapline-${{ github.ref_name }}.zip
            checksum.txt
          if-no-files-found: error
          retention-days: 1

  # Only this job may write (create the release). It has no checkout and no
  # signing secrets; it publishes exactly what the build job packaged.
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package

      - name: Verify checksum
        run: sha256sum --check --strict checksum.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          NOTES=$(cat <<'EOF'
          Part of the package **I love macOS, but I miss some Windows features**, together with [Tappi](https://github.com/leonatwork/Tappi), [Klemmi](https://github.com/leonatwork/Klemmi) and [Snapboard](https://github.com/leonatwork/snapboard).

          ## Installation

          1. Download and unzip `Snapline-__VERSION__.zip`
          2. Drag `Snapline.app` into `/Applications`
          3. On first launch: **right-click ▸ Open**. On macOS 15 and later, use **System Settings ▸ Privacy & Security ▸ Open Anyway** instead.

          Step 3 is needed because this build is not notarised.

          Snapline asks for **Accessibility** (required, to move windows) and **Screen Recording** (optional, for live previews in Snap Assist). Turn off the built-in macOS tiling under **System Settings ▸ Desktop & Dock ▸ Windows**, see the README.

          > **Note:** this build is signed with a stable certificate. Permissions granted once survive later updates that are signed the same way.
          EOF
          )
          NOTES="${NOTES//__VERSION__/$VERSION}"
          # The literal backticks and \n are printf format text, not shell expansions.
          # shellcheck disable=SC2016
          printf '%s\n\n**SHA-256**\n```\n%s\n```\n' "$NOTES" "$(cat checksum.txt)" > notes.md
          gh release create "$VERSION" "Snapline-${VERSION}.zip" \
            --title "Snapline $VERSION" --notes-file notes.md
