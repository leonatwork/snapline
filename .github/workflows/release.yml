name: Release

on:
  push:
    tags: ['v*']
  # Manual run: builds and signs without publishing, the zip is kept as an artifact.
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Import signing certificate
        id: signing
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          # Without the secrets the build falls back to ad-hoc signing.
          if [ -z "$P12" ]; then
            echo "::warning::MACOS_SIGNING_P12 is not set, building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=leonatwork Code Signing" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build
        run: scripts/build-app.sh

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          codesign --verify --strict "dist/Snapline.app"
          # A stable identity shows up as "certificate leaf" in the designated requirement.
          codesign -d -r- "dist/Snapline.app" 2>&1 | grep "certificate leaf"

      - name: Package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
        run: |
          # ditto rather than zip: it preserves the code signature.
          ditto -c -k --keepParent dist/Snapline.app "Snapline-${VERSION}.zip"
          shasum -a 256 "Snapline-${VERSION}.zip" | tee checksum.txt

      - name: Keep manual build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Snapline-manual
          path: Snapline-manual.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          NOTES=$(cat <<'EOF'
          Part of the package **I love macOS, but I miss some Windows features**, together with [Tappi](https://github.com/leonatwork/Tappi), [Klemmi](https://github.com/leonatwork/Klemmi) and [Snapboard](https://github.com/leonatwork/snapboard).

          ## Installation

          1. Download and unzip `Snapline-__VERSION__.zip`
          2. Drag `Snapline.app` into `/Applications`
          3. On first launch: **right-click ▸ Open**. On macOS 15 and later, use **System Settings ▸ Privacy & Security ▸ Open Anyway** instead.

          Step 3 is needed because this build is not notarised.

          Snapline asks for **Accessibility** (required, to move windows) and **Screen Recording** (optional, for live previews in Snap Assist). Turn off macOS' own tiling under **System Settings ▸ Desktop & Dock ▸ Windows**, see the README.

          > **Note:** this build is signed with a stable certificate. Permissions granted once survive later updates that are signed the same way. Coming from 0.2.0, which was ad-hoc signed, grant them once more.
          EOF
          )
          NOTES="${NOTES//__VERSION__/$VERSION}"
          printf '%s\n\n**SHA-256**\n```\n%s\n```\n' "$NOTES" "$(cat checksum.txt)" > notes.md
          gh release create "$VERSION" "Snapline-${VERSION}.zip" \
            --title "Snapline $VERSION" --notes-file notes.md
