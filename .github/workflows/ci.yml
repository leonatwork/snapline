name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check workflow hardening
        run: python3 scripts/check-workflows.py

      - name: Swift build
        run: swift build

      - name: Test
        run: swift test

      - name: Check localizations
        run: scripts/check-localizations.sh

      - name: Build app
        env:
          SIGN_IDENTITY: '-'
        run: scripts/build-app.sh

      - name: Verify ad-hoc signature
        run: |
          codesign --verify --strict "dist/Snapline.app"
          codesign -dv "dist/Snapline.app" 2>&1 | grep -Fx 'Signature=adhoc'
